{% extends "base.html" %}
{% block title %}Post a job — {{ company.company_name }}{% endblock %}

{% block content %}
<div class="wrap" style="max-width:560px;">
  <div class="page-head">
    <div class="eyebrow mono">{{ company.company_name }}</div>
    <h1>Post a job</h1>
  </div>

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="job_title">Job title</label><input type="text" id="job_title" name="job_title" required></div>
      <div class="field"><label for="job_description">Description</label><textarea id="job_description" name="job_description" required></textarea></div>
      <div class="grid-2">
        <div class="field"><label for="job_location">Location</label><input type="text" id="job_location" name="job_location" required></div>
        <div class="field"><label for="job_type">Type</label>
          <select id="job_type" name="job_type">
            <option>Full Time</option>
            <option>Part Time</option>
            <option>Internship</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="job_skills_required">Skills required</label><input type="text" id="job_skills_required" name="job_skills_required" placeholder="e.g. Java, Spring Boot" required></div>
        <div class="field"><label for="job_salary">Salary</label><input type="text" id="job_salary" name="job_salary" placeholder="e.g. 6-8 LPA"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="job_last_date">Last date to apply</label><input type="date" id="job_last_date" name="job_last_date"></div>
        <div class="field"><label for="job_contact_email">Contact email</label><input type="email" id="job_contact_email" name="job_contact_email" required></div>
      </div>
      <div class="row-actions">
        <button class="btn btn-solid" type="submit">Post job</button>
        <a class="btn btn-ghost" href="{% url 'company_after_login' company.id %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
