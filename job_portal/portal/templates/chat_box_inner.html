<div class="chat-thread" id="chatThread">
  {% if messages %}
    {% for m in messages %}
    <div class="bubble-row {% if m.sender == sender_type %}mine{% else %}theirs{% endif %}">
      <div class="bubble">
        <div class="bubble-sender">{{ m.sender }}</div>
        <div class="bubble-text">{{ m.text }}</div>
        <div class="bubble-time">{{ m.timestamp|date:"d M, H:i" }}</div>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty-state" style="border:none;padding:40px 0;">No messages yet. Say hello.</div>
  {% endif %}
</div>

{% if error %}<div class="form-msg error" style="margin-top:14px;">{{ error }}</div>{% endif %}

{% if not chat_allowed %}
  <div class="form-msg" style="background:var(--gold-bg);color:var(--gold-dark);border:1px solid var(--gold);margin-top:14px;">
    This chat unlocks once the ticket is connected.
  </div>
{% endif %}
