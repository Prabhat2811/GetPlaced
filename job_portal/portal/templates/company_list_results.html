{% if companies %}
<div class="entity-grid">
  {% for co in companies %}
  <div class="entity-card">
    <div class="logo-row">
      <img src="{{ co.company_logo.url }}" alt="{{ co.company_name }} logo">
      <div>
        <div class="ename">{{ co.company_name }}</div>
        <div class="eloc">{{ co.company_location }}</div>
      </div>
    </div>
    <div class="stars">{% for i in "12345" %}{% if forloop.counter <= co.company_rating %}&#9733;{% else %}&#9734;{% endif %}{% endfor %}</div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty-state"><h3>No companies found</h3><p>Try a different search term.</p></div>
{% endif %}
